<section class="settings-page">

    <header>
        <span class="settings-eyebrow">PREFERENCIAS</span>
        <h1>Configuración</h1>
        <p>Personaliza cómo se ve UMonge en este dispositivo.</p>
    </header>

    <div class="settings-card">
        <h2>Apariencia</h2>
        <p>Elige entre el modo oscuro y el modo claro. Tu elección se guarda y también se aplica en el inicio de sesión.</p>

        <div class="theme-options">

            <button type="button" class="theme-option" data-theme-option="dark">
                <div class="theme-preview dark"></div>
                <strong>☾ Modo oscuro</strong>
                <small>Diseño original de UMonge</small>
            </button>

            <button type="button" class="theme-option" data-theme-option="light">
                <div class="theme-preview light"></div>
                <strong>☀ Modo claro</strong>
                <small>Grafito translúcido con acentos rojos</small>
            </button>

        </div>
    </div>

</section>
