<style>
.pt-banner { display: block; width: 100%; max-width: 980px; margin: 0 auto 28px; border-radius: 18px; box-shadow: 0 18px 44px rgba(0,0,0,.35); }
.pt-head { text-align: center; margin-bottom: 26px; }
.pt-head h1 { font-size: 26px; margin: 6px 0; }
.pt-eyebrow { color: #EF2B2B; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
.pt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; max-width: 980px; margin: 0 auto; }
.pt-card { padding: 20px; display: flex; gap: 16px; align-items: center; cursor: pointer; text-align: left; }
.pt-card:hover { border-color: #ef2b2b !important; transform: translateY(-2px); }
.pt-card[aria-disabled="true"] { opacity: .8; }
.pt-code { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; font-size: 16px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #D90000, #3a0a0e); }
.pt-card strong { display: block; font-size: 15px; }
.pt-card small { display: block; margin-top: 4px; font-size: 11px; line-height: 1.5; }
.pt-lista { max-width: 980px; margin: 0 auto 10px; font-size: 13px; }
</style>
<section>
    <img class="pt-banner" src="img/bienvenida.png" alt="Bienvenid@s a Universidad Monge · Una misma aplicación">
    <div class="pt-head">
        <span class="pt-eyebrow">UNIVERSIDAD MONGE</span>
        <h1 id="ptSaludo"></h1>
        <p class="mut" style="font-size:13px" id="ptSub"></p>
    </div>
    <div class="pt-grid" id="ptGrid"></div>
</section>
<script>
(function () {
    const UM = window.UM, D = window.UMData, $ = id => document.getElementById(id), esc = UM.esc;
    $("ptSaludo").textContent = "Hola, " + UM.nombre;
    const visibles = D.paisesVisibles(UM.rol, UM.yo), actual = D.pais();
    $("ptSub").textContent = UM.rol === "admin" ? "Elige la administración con la que vas a trabajar." : "Entra a tu administración para ver tus cursos.";
    $("ptGrid").innerHTML = visibles.map(p => {
        const n = D.todos().filter(c => c.pais === p.id).length;
        const mios = D.todos().filter(c => c.pais === p.id && D.estaInscrito(c.id)).length;
        const sub = UM.rol === "estudiante" ? `${mios} cursos inscritos` : n ? `${n} contenidos en el catálogo` : "Sin contenido cargado todavía";
        return `<article class="pt-card" data-p="${p.id}" tabindex="0"><span class="pt-code">${p.id}</span><div><strong>${esc(p.etiqueta)}</strong><small class="mut">${sub}${p.id === actual ? " · actual" : ""}</small></div></article>`;
    }).join("");
    const entrar = e => { const c = e.target.closest("[data-p]"); if (!c || (e.type === "keydown" && e.key !== "Enter")) return; UM.setPais(c.dataset.p); UM.open("dashboard"); };
    $("ptGrid").addEventListener("click", entrar); $("ptGrid").addEventListener("keydown", entrar);
})();
</script>
